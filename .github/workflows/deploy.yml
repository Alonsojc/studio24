name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-${{ github.ref }}"
  # Superseded PR checks are disposable; an active main publication must finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: isolated-test
          POSTGRES_DB: studio24_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
      - name: Install restore verification dependencies
        run: npm ci --ignore-scripts
      - name: Migration and RLS regression tests
        env:
          TEST_DATABASE_URL: postgres://postgres:isolated-test@127.0.0.1:5432/studio24_test
        run: bash scripts/test-db.sh
  build:
    # Playwright 1.59 browser dependencies are supported on Ubuntu 24.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Audit all dependencies
        run: npm run audit:dependencies

      - name: Lint
        run: npm run lint

      - name: Unit tests
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || 'https://example.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'test-anon-key' }}
        run: npm test

      - name: Restore Next.js build cache
        uses: actions/cache@v5
        with:
          path: .next/cache
          key: ${{ runner.os }}-${{ runner.arch }}-node24-next-${{ hashFiles('package-lock.json', 'next.config.*') }}-${{ hashFiles('src/**', 'public/**', 'tsconfig.json', 'postcss.config.*') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-node24-next-${{ hashFiles('package-lock.json', 'next.config.*') }}-

      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || 'https://example.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'test-anon-key' }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
          NEXT_PUBLIC_SENTRY_RELEASE: ${{ github.sha }}
          SENTRY_UPLOAD_SOURCEMAPS: "1"
        run: npm run build

      - name: Prepare and verify Sentry sourcemaps
        run: |
          npx --no-install sentry-cli sourcemaps inject out/_next/static
          node scripts/verify-sourcemaps.mjs prepared out/_next/static

      - name: Install Playwright Chromium
        timeout-minutes: 5
        env:
          PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: "60000"
        # The configured headless project uses this same Chromium headless shell.
        # Skip the separate headed browser download; retain all OS dependencies.
        run: |
          # Avoid stalled Azure mirror downloads. Existing APT sources retain
          # Ubuntu's Signed-By keyring and package integrity verification.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            echo 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt > /dev/null
          fi
          npx playwright install --with-deps --only-shell chromium

      - name: Playwright tests
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          E2E_OPERADOR_EMAIL: ${{ secrets.E2E_OPERADOR_EMAIL }}
          E2E_OPERADOR_PASSWORD: ${{ secrets.E2E_OPERADOR_PASSWORD }}
          E2E_CONTADOR_EMAIL: ${{ secrets.E2E_CONTADOR_EMAIL }}
          E2E_CONTADOR_PASSWORD: ${{ secrets.E2E_CONTADOR_PASSWORD }}
        run: npm run test:e2e

      - name: Upload Sentry sourcemaps
        if: github.event_name != 'pull_request'
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          SENTRY_RELEASE: ${{ github.sha }}
        run: |
          if [ -z "$SENTRY_AUTH_TOKEN" ] || [ -z "$SENTRY_ORG" ] || [ -z "$SENTRY_PROJECT" ]; then
            echo "Sentry sourcemaps disabled; set SENTRY_AUTH_TOKEN, SENTRY_ORG and SENTRY_PROJECT to enable."
            exit 0
          fi
          # Sentry expects a literal ~/ URL prefix, without shell expansion.
          # shellcheck disable=SC2088
          npx --no-install sentry-cli sourcemaps upload --org "$SENTRY_ORG" --project "$SENTRY_PROJECT" --release "$SENTRY_RELEASE" --url-prefix '~/studio24/_next/static' --validate out/_next/static

      - name: Remove sourcemaps from Pages artifact
        run: |
          find out -name "*.map" -delete
          node scripts/verify-sourcemaps.mjs public out

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./out

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [build, database]
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
